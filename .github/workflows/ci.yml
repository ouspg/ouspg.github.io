name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '26'
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp test run --config vitest.config.ts
      - run: vp run typecheck

